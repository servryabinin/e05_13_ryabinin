input {
    file {
        path => "/usr/share/logstash/data/e02_13_ryabinin.csv"
        start_position => "beginning"
        sincedb_path => "/usr/share/logstash/data/.sincedb_inventory"
        mode => "read"
        exit_after_read => true
        # Не удалять исходный CSV после чтения (по умолчанию в режиме read файл удаляется)
        file_completed_action => "log"
        file_completed_log_path => "/usr/share/logstash/data/file_completed.log"
    }
}

filter {
	csv {
		separator => ";"
		columns => ["item_name", "inventory_number", "room_number", "description", "status", "purchase_price", "warranty_months", "purchase_date", "write_off_date", "department", "categories"]
	}
	
	# Игнорируем первую строку с заголовками
	if [item_name] == "item_name" {
		drop { }
	}

	mutate {
		convert => {
			"inventory_number" => "integer"
			"purchase_price" => "integer"
			"warranty_months" => "integer"
		}
	}
	
	date {
		match => ["purchase_date", "yyyy-MM-dd"]
		target => "purchase_date"
	}
	
	date {
		match => ["write_off_date", "yyyy-MM-dd"]
		target => "write_off_date"
	}
	
	split {
		field => "categories"
		terminator => "," # Категории внутри ячейки разделены запятой
	}
	
	mutate {
		remove_field => ["@timestamp", "@version", "path", "host", "message", "event"]
	}
}

output {
	elasticsearch {
		hosts => ["http://elasticsearch:9200"]
		index => "e01_13_ryabinin"
		document_id => "%{inventory_number}"
	}
	stdout {
		codec => rubydebug
	}
}